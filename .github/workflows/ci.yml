name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: API unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Unit tests (pure logic) + coverage
        run: npm run test:cov -- --ci
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: api/coverage
          if-no-files-found: ignore

  api-integration:
    name: API integration (real Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      # Boots its own PostgreSQL (embedded-postgres) and applies the real
      # accounting_core_constraints.sql — asserts triggers + RLS end to end.
      - name: DB guarantees (triggers + RLS)
        run: npm run test:int

  api-typecheck:
    name: API typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
