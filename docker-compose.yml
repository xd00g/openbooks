# =============================================================================
# OpenBooks — local development stack.
# `docker compose up -d` brings up the full app. See README for first-run steps.
# Authentik (OIDC) is intentionally NOT here for a simpler first run; see
# docs/AUTH.md for the overlay that adds it.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openbooks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-openbooks}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openbooks}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-openbooks}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-minio}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the bucket on first boot, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-openbooks} ${S3_SECRET_KEY:-change-me-minio};
      mc mb --ignore-existing local/${S3_BUCKET:-openbooks};
      exit 0;
      "

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-3000}:3000"
    command: ["node", "dist/main.js"]

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "dist/worker.js"]

  # One-off tooling container (Prisma CLI lives in devDeps, which the runtime
  # image omits). Runs with the PRIVILEGED admin URL so it can create/alter
  # schema. Not started by `up`; invoke explicitly:
  #   docker compose run --rm migrate                       # first init (db push)
  #   docker compose run --rm migrate npx prisma migrate deploy
  migrate:
    build:
      context: ./api
      dockerfile: Dockerfile
      target: build
    profiles: ["tools"]
    env_file: .env
    environment:
      DATABASE_URL: ${ADMIN_DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npx", "prisma", "db", "push"]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: ${APP_URL:-http://localhost}/api
    ports:
      - "${WEB_PORT:-5173}:5173"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

  # Cloudflare Tunnel — outbound-only ingress (the VM has no inbound public IP).
  # Create a tunnel in the Cloudflare Zero Trust dashboard, set the public
  # hostname books.doogster.com -> service http://caddy:80, and put the tunnel
  # token in .env as TUNNEL_TOKEN. Started with the `tunnel` profile.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - caddy

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
